{% extends "base.html" %}
{% block title %}Add Task - Task Manager{% endblock %}

{% block content %}
<div class="form-container">
    <div class="page-header">
        <div><h1>Add New Task</h1><p>Create a new task.</p></div>
    </div>

    <form method="POST" class="task-form">
        <label for="title">Task Title *</label>
        <input type="text" id="title" name="title" placeholder="Enter task title" required>

        <label for="description">Description</label>
        <textarea id="description" name="description" rows="5" placeholder="Describe your task..."></textarea>

        <div class="form-row">
            <div>
                <label for="category">Category</label>
                <select id="category" name="category">
                    <option value="Work">Work</option>
                    <option value="Personal" selected>Personal</option>
                    <option value="Study">Study</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div>
                <label for="priority">Priority</label>
                <select id="priority" name="priority">
                    <option value="High">High</option>
                    <option value="Medium" selected>Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
        </div>

        <label for="due_date">Due Date</label>
        <input type="date" id="due_date" name="due_date">

        <div class="form-actions">
            <a href="{{ url_for('index') }}" class="btn btn-light">Cancel</a>
            <button type="submit" class="btn btn-primary">Create Task</button>
        </div>
    </form>
</div>
{% endblock %}
